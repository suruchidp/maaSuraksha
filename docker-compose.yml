services:
  mongodb:
    image: mongo:7
    container_name: maasuraksha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-maasuraksha}
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: maasuraksha-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongodb:27017/${MONGO_DB_NAME:-maasuraksha}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - mongodb

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: maasuraksha-ml-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_DIR: /app/models
      ARTIFACTS_DIR: /app/artifacts
      DATA_DIR: /app/data
    volumes:
      - ml_models:/app/models
      - ml_artifacts:/app/artifacts

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: maasuraksha-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  ml_models:
  ml_artifacts:
